# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "blowfish"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

# robots = ""
fingerprintAlgorithm = "sha256"

[header]
layout = "fixed-fill-blur" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating
# logo = "img/logo.jpg"
# logoDark = "img/dark-logo.jpg"
showTitle = true

[footer]
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = true
showScrollToTop = true

[homepage]
layout = "landing" # valid options: page, profile, hero, card, background, landing, custom
homepageImage = "images/hero.svg"
showRecent = true
showRecentItems = 6
showMoreLink = true
showMoreLinkDest = "/blog/"
cardView = true

[article]
showDate = true
showDateUpdated = true
showAuthor = true
showBreadcrumbs = true
showDraftLabel = true
showEdit = false
# editURL = "https://github.com/username/repo/"
editAppendPath = true
showHeadingAnchors = true
showPagination = true
invertPagination = false
showReadingTime = true
showTableOfContents = true
showTaxonomies = true
showWordCount = true
showComments = false
sharingLinks = [
  "facebook",
  "twitter",
  "mastodon",
  "pinterest",
  "reddit",
  "linkedin",
  "email",
]


[list]
showBreadcrumbs = true
showSummary = true
showTableOfContents = true
showTaxonomies = true
groupByYear = true
paginationWidth = 1

[sitemap]
excludedKinds = ["taxonomy", "term"]

[taxonomy]
showTermCount = true

[fathomAnalytics]
# site = "ABC12345"
# domain = "llama.yoursite.com"

[verification]
# google = ""
# bing = ""
# pinterest = ""
# yandex = ""

[googleTagManager]
# Loaded only after the visitor has given consent (see partials/extend-head.html)
id = "GTM-KG8ND8T"
