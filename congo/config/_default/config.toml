# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/


# KIILS
baseURL = "https://www.kiils.dk/"
publishDir = '../docs'
defaultContentLanguage = "da"
enableRobotsTXT = true
# paginate = 128
summaryLength = 0

[languages]

[languages.da]
contentDir = '/Users/lk/Web/kiils.dk/da/'

[languages.en]
contentDir = '/Users/lk/Web/kiils.dk/en/'

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
brands = "brands"
cases = "cases"
#cm = "cm"
emner = "emner"
tools = "tools"
genrer = "genrer"
tags = "tags"
categories = "categories"
person = "person"

[security]
# Allow raw HTML content files (e.g. da/hidden/index.html); still block Org files
allowContent = ['! ^text/org$']

# Course, client and service pages are not dated articles
[[cascade]]
  [cascade.params]
    showDate = false
    showDateUpdated = false
    showReadingTime = false
    showWordCount = false
    showAuthor = false
  [cascade.target]
    path = '{/kursus/**,/kunde/**,/clients/**,/ydelse/**,/en/clients/**}'
