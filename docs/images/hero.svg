<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="url(#base)"/>
  <g filter="url(#blur)">
    <circle cx="260" cy="120" r="260" fill="#2563eb" fill-opacity="0.75"/>
    <circle cx="820" cy="560" r="240" fill="#7c3aed" fill-opacity="0.6"/>
    <circle cx="1360" cy="160" r="280" fill="#06b6d4" fill-opacity="0.55"/>
    <circle cx="1100" cy="420" r="160" fill="#db2777" fill-opacity="0.35"/>
  </g>
  <rect width="1600" height="640" fill="url(#grid)"/>
</svg>
